name: check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏗️ Build
        run: bun run build

      - name: 🎨 Format
        run: bun run format

      - name: 🔎 Analyze dependencies
        run: bunx knip -n --reporter compact

      - name: 🧪 Typecheck
        run: bunx tsc --noEmit --pretty false

      - name: ✅ Test
        run: bun test

  runtime-smoke:
    name: Runtime smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node 22
            node-version: 22.13.0
            command: bun run runtime:smoke:node
          - name: Node 24
            node-version: 24
            command: bun run runtime:smoke:node
          - name: Bun 1.3
            node-version: 24
            command: bun run runtime:smoke:bun

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: 📦 Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏗️ Build
        run: bun run build

      - name: ✅ Smoke
        run: ${{ matrix.command }}

  package-pack:
    name: Package pack
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: 📦 Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏗️ Build
        run: bun run build

      - name: 📦 Pack package
        run: |
          mkdir -p "${RUNNER_TEMP}/package"
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/package"

      - name: ⬆️ Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-smoke-tarball
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  package-smoke:
    name: Package smoke (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: package-pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: npm
            command: bun run package:smoke:npm package/*.tgz
            corepack: ''
          - name: pnpm
            command: bun run package:smoke:pnpm package/*.tgz
            corepack: pnpm@10
          - name: Yarn
            command: bun run package:smoke:yarn package/*.tgz
            corepack: yarn@4
          - name: Bun
            command: bun run package:smoke:bun package/*.tgz
            corepack: ''

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: 📦 Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: 📦 Set up package manager
        if: ${{ matrix.corepack != '' }}
        run: |
          corepack enable
          corepack prepare "${{ matrix.corepack }}" --activate

      - name: ⬇️ Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-smoke-tarball
          path: package

      - name: ✅ Smoke
        run: ${{ matrix.command }}
